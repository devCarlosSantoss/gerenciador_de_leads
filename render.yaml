# Render Blueprint — deploiement en Render (plan gratuit)
# https://render.com -> "New +" -> "Blueprint" -> selecione este repositório
services:
  - type: web
    name: leads-pro
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # preencha no painel com a connection string do Neon/Supabase
      - key: JWT_SECRET
        sync: false # defina a mesma JWT_SECRET usada no serviço backend (openssl rand -hex 32)
      - key: PROSPECTING_API_URL
        sync: false # URL pública do serviço backend (ex.: https://backend.onrender.com)
      - key: PROSPECTING_ORG_ID
        sync: false # id do tenant usado nas chamadas (X-Org-ID)